# Plantilla de proyecto — Análisis de Socavación MTC 2018
# Unidades: Q m³/s, longitudes m, D50 mm, cotas m s.n.m.
# Valores ilustrativos NO sustentados para un proyecto real. No son tablas normativas.
# Plantilla completa trazable: ejemplos/puente_mtc_trazable.yaml

proyecto:
  nombre: "Puente Rio Ejemplo"
  modo: preliminar
  Q100: 850.0
  Q500: 1200.0
  Q_ot: null

cauce:
  tipo: degradacion          # estable | degradacion | agradacion
  y_sg_lp: 0.50
  notas: "Cauce aluvial degradante — criterio conservador 0.50 m"

estribo_izquierdo:
  D50_mm: 2.5
  Z_lecho: 2450.30
  forma: muro_vertical       # muro_vertical | muro_vertical_aletas_45 | talud_2h1v | talud_3h1v
  angulo_ataque: 90.0
  L_prima: 12.0
  Ae: 85.0
  q100:
    y1: 3.20
    V1: 2.10
    W1: 45.0
    W2: 38.0
    y0: 3.00
    Sf: 0.002
    beta: 1.00       # MTC HHD: coeficiente de frecuencia, justificar por Tr
    mu: 0.89         # MTC HHD: factor de contracción según luz libre y V
    phi: 1.00        # MTC HHD: factor de transporte; validar con sedimentos
    exponente_x: 0.38
    Dm_mm: 2.95      # diámetro característico del lecho, mm
  q500:
    y1: 4.10
    V1: 2.80
    W1: 48.0
    W2: 38.0
    y0: 3.50
    Sf: 0.002
    beta: 1.05
    mu: 0.89
    phi: 1.00
    exponente_x: 0.38
    Dm_mm: 2.95

estribo_derecho:
  D50_mm: 3.0
  Z_lecho: 2450.10
  forma: muro_vertical
  angulo_ataque: 90.0
  L_prima: 10.0
  Ae: 72.0
  q100:
    y1: 3.15
    V1: 2.05
    W1: 45.0
    W2: 38.0
    y0: 3.00
    Sf: 0.002
    beta: 1.00
    mu: 0.89
    phi: 1.00
    exponente_x: 0.38
    Dm_mm: 2.95
  q500:
    y1: 4.05
    V1: 2.75
    W1: 48.0
    W2: 38.0
    y0: 3.50
    Sf: 0.002
    beta: 1.05
    mu: 0.89
    phi: 1.00
    exponente_x: 0.38
    Dm_mm: 2.95

